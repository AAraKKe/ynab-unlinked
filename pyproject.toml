[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
# The README links the screenshots on GitHub; the package does not need 3 MB of them
exclude = ["docs/screenshots"]

[project]
name = "ynab-unlinked"
version = "1.1.0"
description = "Keep the accounts YNAB cannot link up to date and see what your budget data means, from the command line or a local web app"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
keywords = []
authors = [{ name = "Juanpe Araque", email = "juanpe@committhatline.com" }]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: Implementation :: CPython",
  # The ones CI runs on; the keychain and the paths come from keyring and platformdirs
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
]
dependencies = [
  "ynab==5.0.0",
  "typer==0.28.0",
  "html-text==0.7.1",
  "pdfplumber==0.11.10",
  "pydantic==2.14.3",
  "platformdirs==4.14.5",
  "pyexcel==0.7.6",
  "pyexcel-xls==0.7.1",
  "pyexcel-xlsx==0.6.1",
  "textual==8.2.8",
  "keyring==25.7.0",
]

[project.optional-dependencies]
web = ["nicegui==4.0.0"]

[project.scripts]
yul = "ynab_unlinked.main:main"

[project.urls]
Documentation = "https://github.com/AAraKKe/ynab-unlinked#readme"
Issues = "https://github.com/AAraKKe/ynab-unlinked/issues"
Source = "https://github.com/AAraKKe/ynab-unlinked"
Privacy = "https://github.com/AAraKKe/ynab-unlinked/blob/main/PRIVACY.md"

# ------ Development ------
# `uv sync` installs the dev group (and the web extra through it); `uv run poe <task>` runs
# the tasks below. `uv.lock` pins the whole tree, transitive dependencies included.
[dependency-groups]
dev = [
  "ynab-unlinked[web]",
  "poethepoet==0.49.0",
  "ruff==0.17.4",
  "pyright==1.1.414",
  "pytest==9.2.0",
  "pytest-cov==7.1.0",
  "pytest-mock==3.17.0",
  "pytest-asyncio==1.4.1.post1",
  "factory_boy==3.3.3",
  "freezegun==1.5.5",
  "towncrier==26.9.0",
]

[tool.poe.tasks]
lint = { cmd = "ruff check", help = "Lint with ruff" }
format-check = { cmd = "ruff format --check", help = "Check the formatting" }
type-check = { cmd = "pyright src", help = "Type check src with pyright" }
check = { sequence = ["lint", "format-check", "type-check"], help = "Lint, format check and type check, stopping at the first failure" }
check-all = { sequence = ["lint", "format-check", "type-check"], ignore_fail = "return_non_zero", help = "Every check even when an earlier one fails, for a full report" }
format = { cmd = "ruff format", help = "Format with ruff" }
lint-fix = { cmd = "ruff check --fix --unsafe-fixes", help = "Apply ruff autofixes" }
fix = { sequence = ["format", "lint-fix"], help = "Format and autofix" }
cov = { cmd = "pytest --cov=src --cov-report term-missing:skip-covered tests", help = "Tests with coverage, extra args go to pytest" }
tc-exists = { cmd = "towncrier check", help = "Check the branch has a changelog fragment" }
tc-names = { cmd = "python scripts/fragments.py", help = "Check every changelog fragment is named after its PR" }
tc-check = { sequence = ["tc-exists", "tc-names"], help = "Check the branch has a changelog fragment, named after its PR" }
tc-show = { cmd = "towncrier build --draft", help = "Preview the next changelog" }
tc-build = { cmd = "towncrier build --yes", help = "Build CHANGELOG.md from the fragments" }
release = { cmd = "python scripts/release.py", help = "Open the release PR: uv run poe release X.Y.Z [-m MESSAGE]" }

[tool.pyright]
# `src` is checked in strict mode; tests stay at the default level.
strict = ["src"]
exclude = [
  "**/.vscode/**",
  "**/__pycache__/**",
  "**/.egg-info/**",
  "**/.git/**",
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.venv/**",
  "**/*.egg-info/**",
  "dist",
]
ignore = [
  "**/.vscode/**",
  "**/__pycache__/**",
  "**/.egg-info/**",
  "**/.git/**",
  "**/.mypy_cache/**",
  "**/.pytest_cache/**",
  "**/.venv/**",
  "**/*.egg-info/**",
  "dist",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = [
  # pycodestyle
  "E",
  # Pyflakes
  "F",
  # pyupgrade
  "UP",
  # flake8-bugbear
  "B",
  # flake8-simplify
  "SIM",
  # isort
  "I",
]

[tool.ruff.lint.isort]
known-first-party = ["ynab_unlinked", "tests", "scripts"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 120
max-line-length = 120

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = "tests"
markers = ["version: used to identify the Config version used in the test"]
# The web app tests drive NiceGUI's simulated user, which is async
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source_pkgs = ["ynab_unlinked"]
branch = true
parallel = true
omit = ["src/ynab_unlinked/__about__.py"]

[tool.coverage.report]
exclude_also = [
  "no cov",
  "if __name__ == .__main__.:",
  # Exclude protocol classes since they have no logic
  'class .*\bProtocol\):',
  # Exclude assert_nevers since we will never hit them and should be flagged by type checkers
  '^ +assert_never\(.*?\)$',
  # Case statements should be exhaustive
  '^ +case .*? as unreachable:$',
  # Ignore @overload functions
  '^ +@overload$',
  # Ignore type checking imports
  'if TYPE_CHECKING:',
  # This breaks on import, cannot even test so there is no reason to cover
  "__init_subclass__",
  # No reason to cover abstract methods
  "@abstractmethod",
]

[tool.coverage.paths]
ynab_unlinked = ["src/ynab_unlinked"]

[tool.towncrier]
package = "ynab_unlinked"
package_dir = "src"
underlines = ["", "", ""]
filename = "CHANGELOG.md"
directory = "changelog"
title_format = "## ynab-unlinked {version} ({project_date})"
template = "changelog/_template.jinja"
ignore = [".github/**", ".gitignore"]


[[tool.towncrier.type]]
# When a feature is being removed. Should be messagaging
# deprecation to users in previuos versions
directory = "removed"
name = "Gone but not forgotten (RIP Features)"
showcontent = true

[[tool.towncrier.type]]
# Still not removed but added deprecation warnings
directory = "deprecated"
name = "On the Chopping Block (Use at your own risk!)"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Fresh Out of the Feature Oven"
showcontent = true

[[tool.towncrier.type]]
# New behaviors in existing features.
directory = "improved"
name = "Polished Until It Shines"
showcontent = true

[[tool.towncrier.type]]
# Something we deemed an improper undesired behavior that got corrected
# in the release to match pre-agreed expectations.
directory = "bugfix"
name = "Bugs Squashed, Peace Restored"
showcontent = true

[[tool.towncrier.type]]
# Updates regarding bundling dependencies.
directory = "bumped"
name = "Under the Hood Upgrades"
showcontent = true

[[tool.towncrier.type]]
# Notable updates to the documentation structure or build process.
directory = "doc"
name = "Read All About It! (Docs Updates)"
showcontent = true

[[tool.towncrier.type]]
# Stuff that affects the contributor experience. e.g. Running tests,
# format checks, actions...
directory = "contrib"
name = "For the Builders: Dev Experience Upgrades"
showcontent = true

[[tool.towncrier.type]]
# Changes that are hard to assign to any of the above categories.
directory = "misc"
name = "Secret Sauce (Other Changes)"
showcontent = true
