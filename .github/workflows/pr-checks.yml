name: PR Checks

on:
  # Every pull request, whatever its base: a PR stacked on a feature branch is checked too
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-checks:
    # The ubuntu job keeps its plain "PR checks" name so a required check by that name still matches
    name: PR checks${{ matrix.os == 'macos-latest' && ' (macOS)' || '' }}${{ matrix.python != '3.13' && format(' (Python {0})', matrix.python) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the keychain and platformdirs paths for real; 3.14 is what the dev env runs
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: uv sync --locked

      - name: Run towncrier check
        run: uv run --no-sync poe tc-check

      - name: Run ruff lint
        run: uv run --no-sync poe lint

      - name: Run format check
        run: uv run --no-sync poe format-check

      - name: Run type-check
        run: uv run --no-sync poe type-check

      - name: Run Unit Tests
        run: uv run --no-sync poe cov

      # A web test that reads the page before the work it waits for has finished passes on
      # a fast machine and fails now and then on a busy one. Slowed, it fails every time.
      - name: Run web tests with slow off-loop work
        run: uv run --no-sync poe races