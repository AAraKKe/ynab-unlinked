name: PR Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-checks:
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --locked

      - name: Run towncrier check
        run: uv run --no-sync poe tc-check

      - name: Run ruff lint
        run: uv run --no-sync poe lint

      - name: Run format check
        run: uv run --no-sync poe format-check

      - name: Run type-check
        run: uv run --no-sync poe type-check

      - name: Run Unit Tests
        run: uv run --no-sync poe cov
