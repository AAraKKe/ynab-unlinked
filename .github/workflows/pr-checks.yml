name: PR Checks

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, edited]

jobs:
  pr-checks:
    # The ubuntu job keeps its plain "PR checks" name so a required check by that name still matches
    name: PR checks${{ matrix.os == 'macos-latest' && ' (macOS)' || '' }}${{ matrix.python != '3.13' && format(' (Python {0})', matrix.python) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS runs the keychain and platformdirs paths for real; 3.14 is what the dev env runs
        os: [ubuntu-latest, macos-latest]
        python: ["3.13", "3.14"]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch

      - name: Run towncrier check
        run: hatch run tc:check

      - name: Run ruff lint
        run: hatch run dev:lint

      - name: Run format check
        run: hatch run dev:format-check

      - name: Run type-check
        run: hatch run dev:type-check

      - name: Run Unit Tests
        run: hatch run dev:cov