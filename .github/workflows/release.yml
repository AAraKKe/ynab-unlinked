name: Release

on:
  push:
    tags:
      - "yul-*.*.*"

env:
  PYTHON_VERSION: "3.13"

# Jobs ask for what they need; nothing is granted to all of them
permissions: {}

jobs:
  validate:
    name: Validate Version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag_version: ${{ steps.set_vars.outputs.tag_version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check that the tag is on main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "❌ The tagged commit is not on main."
            exit 1
          fi
          echo "✅ The tag is on main."

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Hatch
        run: pip install hatch==1.17.1

      - name: Run the checks and the tests on the tagged commit
        run: |
          hatch run dev:check
          hatch run dev:cov

      - name: Set up version variables
        id: set_vars
        run: |
          TAG_NAME="${{ github.ref_name }}"
          TAG_VERSION="${TAG_NAME#yul-}"
          echo "TAG_VERSION=${TAG_VERSION}" >> $GITHUB_ENV
          echo "tag_version=${TAG_VERSION}" >> $GITHUB_OUTPUT

      - name: Check package version coherence
        run: |
          PACKAGE_VERSION=$(hatch version)
          echo "INFO: Tag version is ${TAG_VERSION}, package version is ${PACKAGE_VERSION}."
          if [[ "$PACKAGE_VERSION" != "$TAG_VERSION" ]]; then
            echo "❌ Version Mismatch: Tag version (${TAG_VERSION}) does not match package version from hatch (${PACKAGE_VERSION})."
            exit 1
          fi
          echo "✅ Package version matches tag."

      - name: Check for changelog entry
        run: |
          echo "INFO: Checking for changelog entry for version ${TAG_VERSION}."
          CHANGELOG_PATTERN="^##.*ynab-unlinked.*${TAG_VERSION//./\\.}"
          if ! grep -q -E "$CHANGELOG_PATTERN" CHANGELOG.md; then
            echo "❌ Changelog entry not found for version ${TAG_VERSION} in CHANGELOG.md."
            exit 1
          fi
          echo "✅ Changelog entry found."

      - name: Check that no changelog fragment is pending
        run: |
          # A fragment left in changelog/ means the release notes were built before the last change
          PENDING=$(ls changelog | grep -v '^_template' || true)
          if [[ -n "$PENDING" ]]; then
            echo "❌ Release notes are stale: run 'hatch run tc:build' and commit it. Pending fragments:"
            echo "$PENDING"
            exit 1
          fi
          echo "✅ No changelog fragment pending."

  build-and-publish:
    name: Build and Publish to PyPI
    # This job now runs after validation
    needs: validate
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install hatch==1.17.1

      - name: Build package
        run: hatch build

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  create-release:
    name: Create GitHub Release
    # This job now runs last, after the package is published
    needs: [validate, build-and-publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract release notes from CHANGELOG
        id: extract_notes
        run: |
          # Still gets the version from the 'validate' job's output
          VERSION_NUMBER="${{ needs.validate.outputs.tag_version }}"
          SEARCH_PATTERN="^##.*ynab-unlinked.*${VERSION_NUMBER//./\\.}"

          echo "body<<EOF" >> $GITHUB_OUTPUT
          awk -v pattern="$SEARCH_PATTERN" '
            $0 ~ pattern { p=1; next }
            /^## / && p { exit }
            p { print }
          ' CHANGELOG.md >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        id: release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body: ${{ steps.extract_notes.outputs.body }}
          draft: false
          prerelease: false
