name: Changelog

on:
  pull_request_target:
    types:
      - opened
      - synchronize

jobs:
  create-changelog-entry:
    runs-on: ubuntu-latest
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Create changelog entry
        env:
          # Never interpolate the title into the script: it is attacker controlled text
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          FILE="changelog/${PR_NUMBER}.bumped.md"
          if [ -f "$FILE" ]; then
            echo "$FILE already exists. Skipping."
          else
            printf '%s\n' "$PR_TITLE" > "$FILE"
          fi

      - name: Commit and push changelog entry
        uses: stefanzweifel/git-auto-commit-action@d0b01107b5db882071f96de5dd4b54961ea93f4c # v7.2.1
        with:
          commit_message: "docs(changelog): Add entry for dependency update [dependabot skip]"
          file_pattern: "changelog/*.md"
