name: Changelog

on:
  pull_request_target:
    types:
      - opened
      - synchronize

jobs:
  create-changelog-entry:
    runs-on: ubuntu-latest
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Create changelog entry
        run: |
          FILE="changelog/${{ github.event.pull_request.number }}.bumped.md"
          if [ -f "$FILE" ]; then
            echo "$FILE already exists. Skipping."
          else
            echo "${{ github.event.pull_request.title }}" > "$FILE"
          fi

      - name: Commit and push changelog entry
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: "docs(changelog): Add entry for dependency update [dependabot skip]"
          file_pattern: "changelog/*.md"
