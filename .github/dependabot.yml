version: 2
updates:
  # 1. GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "github-actions"
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"

  # 2. Python packages: bumps the pins in pyproject.toml and refreshes uv.lock in the same PR
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "python"
      - "dependencies"
    groups:
      python-dependencies:
        patterns:
          - "*"
